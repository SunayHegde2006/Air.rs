[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SunayHegde2006/Air.rs"

[workspace.dependencies]
bytemuck = { version = "1", features = ["derive"] }
half = { version = "2", features = ["num-traits"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libloading = "0.8"
wgpu = "24"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
indicatif = "0.17"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "blocking"] }
io-uring = "0.7"



[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 256
strip = true
panic = "abort"
overflow-checks = false
